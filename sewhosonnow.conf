# sewhosonnow.conf -- example site config for sewhosonnow.cgi (v1.3).
# Same directory as the script. Only set what differs from the
# built-in defaults in the script. This file must end with "1;".
# If this file is missing, the script uses its defaults.
# If it exists but has an error, the script dies loudly.

# 24-hour window (same as the script default, shown for clarity).
$timespan = 60*60*24;

# Show the timespan ("within the past 24 hours").
# 0 = "currently online", 1 = "within the past X",
# 2 = verbose "both windows" mode.
$showtimespan = 1;

# "On now" window: 30 minutes. Adds "(and X of them are here right now...)".
# Set to 0 (or delete this line) to omit it.
$onnowspan = 60*30;

# Data file (same directory as the script).
$whosonnow_file = "sewhosonnow.dat";

# Nouns for the output.
$visitor_singular = "visitor";
$visitor_plural = "visitors";

# File locking on (Unix).
$flock = 1;

# Welcome-back message for reloaders.
$welcomeback = "Welcome back!";

# Count each IP once per window (0 = dedupe, 1 = count reloads).
$allow_recount = 0;

1;
